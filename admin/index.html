<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174b4a"><title>Painel administrativo | Hadassa Moda</title><style>
:root{--deep:#174b4a;--teal:#087f83;--coral:#d77b61;--sand:#f4ead9;--cream:#fffdf8}*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:var(--deep);font:15px Arial,sans-serif}.top{background:var(--deep);color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font: bold 24px Georgia;letter-spacing:3px}.brand small{display:block;font:10px Arial;letter-spacing:4px;color:#f0c6a9;margin-top:4px}.wrap{max-width:1100px;margin:32px auto;padding:0 18px}.login,.panel,.formbox{background:white;border-radius:16px;padding:24px;box-shadow:0 8px 30px #173c3b12}.login{max-width:420px;margin:70px auto}.hidden{display:none!important}h1{font: bold 26px Georgia;margin:0 0 8px}h2{font-size:19px;margin:0 0 18px}p{color:#637572}label{display:block;font-size:12px;font-weight:bold;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #dce4df;border-radius:9px;font:inherit;background:#fff}input[type=file]{padding:14px;background:#f4ead9;border:2px dashed #087f83;cursor:pointer}input[type=file]::file-selector-button{border:0;border-radius:7px;padding:10px 13px;margin-right:12px;background:#087f83;color:white;font-weight:bold;cursor:pointer}textarea{min-height:70px;resize:vertical}.btn{border:0;border-radius:9px;padding:12px 17px;background:var(--teal);color:white;font-weight:bold;cursor:pointer}.btn.alt{background:var(--sand);color:var(--deep)}.btn.danger{background:#a63f37}.btn:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:20px}.products{display:grid;gap:10px}.product{display:flex;gap:14px;align-items:center;border:1px solid #e6ebe6;border-radius:12px;padding:10px}.product img{width:64px;height:70px;object-fit:cover;border-radius:8px;background:var(--sand)}.product .info{flex:1;min-width:0}.product strong{display:block}.muted{font-size:12px;color:#71817b}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:11px;border-radius:8px;background:#fff1e9;color:#8b4936;margin:12px 0}.success{background:#e8f4ed;color:#22613d}.empty{text-align:center;padding:30px;color:#71817b}.logout{background:transparent;color:white;border:1px solid #ffffff70;border-radius:8px;padding:9px 12px;cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{padding:18px}.wrap{margin:20px auto}}
</style></head><body><header class="top"><div class="brand">HADASSA<small>PAINEL ADMINISTRATIVO</small></div><button id="logout" class="logout hidden">Sair</button></header>
<main class="wrap"><section id="login" class="login"><h1>Entrar no painel</h1><p>Use a senha administrativa da sua loja.</p><form id="loginForm"><label>Senha de administrador</label><input id="password" type="password" required autocomplete="current-password" placeholder="Digite sua senha"><p id="loginMsg" class="notice hidden"></p><button class="btn" style="width:100%;margin-top:16px">Entrar</button></form></section>
<section id="app" class="hidden"><h1>Produtos</h1><p>Cadastre e mantenha seu catálogo atualizado.</p><div id="message" class="notice hidden"></div><div class="layout"><section class="formbox"><h2 id="formTitle">Adicionar produto</h2><form id="productForm"><input type="hidden" id="productId"><label>Nome do produto *</label><input id="name" required placeholder="Ex.: Biquíni Aurora"><label>Descrição</label><textarea id="description" placeholder="Detalhes do produto"></textarea><div class="grid"><div><label>Preço (R$) *</label><input id="price" type="number" min="0" step=".01" required placeholder="0,00"></div><div><label>Estoque</label><input id="stock" type="number" min="0" step="1" value="0"></div></div><label>SELECIONAR FOTO DO COMPUTADOR OU CELULAR</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><p class="muted">Escolha uma foto da galeria ou dos arquivos. A imagem será otimizada automaticamente.</p><div id="imagePreview" class="hidden" style="margin:10px 0"><img id="previewImg" alt="Prévia da foto" style="width:120px;height:140px;object-fit:cover;border-radius:10px"><button type="button" id="removeImage" class="btn alt" style="display:block;margin-top:7px">Remover foto</button></div><label>Ou cole um link da imagem (opcional)</label><input id="image" type="text" placeholder="https://..."><label>Categoria</label><input id="category" value="Moda praia"><label>Tamanhos</label><input id="sizes" placeholder="P, M, G, GG"><label>Status</label><select id="active"><option value="1">Ativo</option><option value="0">Inativo</option></select><div class="row" style="margin-top:18px"><button class="btn" id="save">Salvar produto</button><button type="button" class="btn alt hidden" id="cancel">Cancelar</button></div></form></section><section class="panel"><div class="row" style="justify-content:space-between"><h2>Produtos cadastrados</h2><button id="refresh" class="btn alt">Atualizar</button></div><div id="products" class="products"><div class="empty">Carregando...</div></div></section></div></section></main>
<script>
const $=id=>document.getElementById(id);let auth=localStorage.getItem("hadassa_admin_token")||"";let selectedImage="";
const api=async(path,opts={})=>{const r=await fetch("/api/products"+path,{...opts,headers:{"content-type":"application/json",...(auth?{authorization:"Bearer "+auth}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({error:"Resposta inválida"}));if(!r.ok)throw Error(d.error||"Erro na operação");return d};
function message(t,ok=false){$("message").textContent=t;$("message").className="notice"+(ok?" success":"");$("message").classList.remove("hidden")}
function showApp(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");load() }
function clearPhoto(){selectedImage="";$("imageFile").value="";$("image").value="";$("imagePreview").classList.add("hidden");$("previewImg").removeAttribute("src")}function reset(){ $("productForm").reset();clearPhoto();$("productId").value="";$("category").value="Moda praia";$("stock").value="0";$("active").value="1";$("formTitle").textContent="Adicionar produto";$("save").textContent="Salvar produto";$("cancel").classList.add("hidden") }
async function load(){try{const d=await api("");$("products").innerHTML=d.products.length?d.products.map(p=>'<article class="product"><img src="'+(p.image||"https://placehold.co/100x110/f4ead9/174b4a?text=Hadassa")+'" onerror="this.src=\'https://placehold.co/100x110/f4ead9/174b4a?text=Hadassa\'"><div class="info"><strong>'+esc(p.name)+'</strong><div class="muted">R$ '+Number(p.price).toFixed(2).replace(".",",")+' · Estoque: '+p.stock+' · '+(p.active?'Ativo':'Inativo')+'</div></div><div class="actions"><button class="btn alt" onclick="editProduct('+p.id+')">Editar</button><button class="btn danger" onclick="deleteProduct('+p.id+')">Excluir</button></div></article>').join(""):'<div class="empty">Nenhum produto cadastrado ainda.</div>'}catch(e){message(e.message)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.editProduct=async id=>{try{const {products}=await api("");const p=products.find(x=>x.id===id);if(!p)return;for(const k of ["name","description","price","stock","category","sizes"])$(k).value=p[k]??"";selectedImage=(p.image||"").startsWith("data:image/")?p.image:"";$("image").value=selectedImage?"":(p.image||"");if(selectedImage){$("previewImg").src=selectedImage;$("imagePreview").classList.remove("hidden")}else{$("imagePreview").classList.add("hidden")}$("imageFile").value="";$("active").value=p.active?"1":"0";$("productId").value=p.id;$("formTitle").textContent="Editar produto";$("save").textContent="Salvar alterações";$("cancel").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}catch(e){message(e.message)}};
window.deleteProduct=async id=>{if(!confirm("Tem certeza que deseja excluir este produto?"))return;try{await api("?id="+id,{method:"DELETE"});message("Produto excluído.",true);load()}catch(e){message(e.message)}};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").classList.add("hidden");try{const r=await fetch("/api/products?action=login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json().catch(()=>({error:"A API não respondeu corretamente. Atualize a página e tente novamente."}));if(!r.ok)throw Error(d.error||"Não foi possível entrar");auth=d.token;localStorage.setItem("hadassa_admin_token",auth);showApp()}catch(e){$("loginMsg").textContent=e.message;$("loginMsg").classList.remove("hidden")}};
$("imageFile").onchange=async()=>{const file=$("imageFile").files[0];if(!file)return;if(!file.type.startsWith("image/")){message("Escolha um arquivo de imagem.");return}try{message("Preparando foto...");selectedImage=await optimizeImage(file);$("previewImg").src=selectedImage;$("imagePreview").classList.remove("hidden");$("image").value="";message("Foto pronta para salvar.",true)}catch(e){selectedImage="";$("imageFile").value="";message("Não foi possível abrir essa foto. Tente JPG ou PNG.")}};
function optimizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);let quality=.78,data=canvas.toDataURL("image/webp",quality);while(data.length>430000&&quality>.42){quality-=.08;data=canvas.toDataURL("image/webp",quality)}if(data.length>520000){const s=.78;canvas.width=Math.round(canvas.width*s);canvas.height=Math.round(canvas.height*s);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL("image/webp",.55)}if(data.length>520000)reject(new Error("Foto muito grande"));else resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
$("removeImage").onclick=clearPhoto;
$("productForm").onsubmit=async e=>{e.preventDefault();const id=$("productId").value;const image=selectedImage||$("image").value.trim();if(image&&!image.startsWith("data:image/")&&!/^https?:\/\//i.test(image)){message("O link da foto precisa começar com https://");return}const p={name:$("name").value,description:$("description").value,price:Number($("price").value),stock:Number($("stock").value),image,category:$("category").value,sizes:$("sizes").value,active:$("active").value==="1"};try{$("save").disabled=true;$("save").textContent="Salvando...";await api(id?"?id="+id:"",{method:id?"PUT":"POST",body:JSON.stringify(p)});reset();message(id?"Produto atualizado com sucesso.":"Produto cadastrado com sucesso.",true);load()}catch(e){message(e.message)}finally{$("save").disabled=false;$("save").textContent=$("productId").value?"Salvar alterações":"Salvar produto"}};
$("cancel").onclick=reset;$("refresh").onclick=load;$("logout").onclick=()=>{auth="";localStorage.removeItem("hadassa_admin_token");$("app").classList.add("hidden");$("login").classList.remove("hidden");$("logout").classList.add("hidden");$("password").value=""};
if(auth)showApp();
</script></body></html>
